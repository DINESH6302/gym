server.port=3000

# SQLite
spring.datasource.url=jdbc:sqlite:${opengym.data-dir:./data}/opengym.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# JSON body limit (match the 5MB Node.js limit)
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.max-file-size=5MB
server.tomcat.max-http-form-post-size=5242880

# App config
opengym.data-dir=./data
opengym.session-days=90
opengym.allow-guest=true
